# Render Blueprint — ReuseHub backend
#
# Deploy the backend on Render with one click (or `render blueprint launch`)
# from the repo root:
#
#   render blueprint launch
#
# This provisions a single Web Service running Django + gunicorn backed by a
# managed PostgreSQL database.
#
# Database: this blueprint targets the Render managed Postgres instance
# `dpg-dae24gtbedkc73b1vq90-a` (database `reusehub`). Inside Render's network
# the service connects with the INTERNAL host `dpg-dae24gtbedkc73b1vq90-a` via
# SSL; outside Render (local dev) use the external host
# `dpg-dae24gtbedkc73b1vq90-a.virginia-postgres.render.com`. The DB password is
# NOT stored here — set it as a secret (sync: false) in the Render dashboard,
# or set DATABASE_URL there and drop the POSTGRES_* block.
#
# A persistent disk still holds uploaded MEDIA only (the database itself now
# lives in managed Postgres, so it survives redeploys natively).

services:
  - type: web
    name: reusehub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "./render-start.sh"
    healthCheckPath: /admin/login/

    # Persistent disk holds uploaded media (backend/data/media). Survives
    # redeploys. The database is managed Postgres — no disk needed for it.
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: 3.12.8
      # Use the managed Postgres (not SQLite).
      - key: USE_SQLITE
        value: "false"
      - key: POSTGRES_DB
        value: reusehub
      - key: POSTGRES_USER
        value: reusehub_user
      # INTERNAL host — resolvable only inside Render's network.
      - key: POSTGRES_HOST
        value: dpg-dae24gtbedkc73b1vq90-a
      - key: POSTGRES_PORT
        value: "5432"
      # Managed Postgres requires TLS.
      - key: POSTGRES_SSLMODE
        value: require
      # Real password — set manually in the Render dashboard
      # (Dashboard → reusehub-backend → Environment → POSTGRES_PASSWORD).
      - key: POSTGRES_PASSWORD
        sync: false
      # Uploaded media on the persistent disk.
      - key: MEDIA_ROOT
        value: /opt/render/project/src/data/media
      - key: DEBUG
        value: "false"
      - key: ALLOW_DEV
        value: "false"
      - key: SECURE_HTTP
        value: "true"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      # Comma-separated list of allowed browser origins (the mobile/web app URLs).
      # Example: https://your-app.expo.dev, https://your-web-app.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Public hostname where ClickPesa sends webhooks — set to
      # https://reusehub-backend.onrender.com (the exact service URL).
      - key: CLICKPESA_WEBHOOK_BASE_URL
        sync: false
      - key: NGROK_PUBLIC_URL
        sync: false
      # Secrets — set these manually in the Render dashboard (never commit).
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CLICKPESA_CLIENT_ID
        sync: false
      - key: CLICKPESA_API_KEY
        sync: false
      - key: CLICKPESA_CHECKSUM_SECRET
        sync: false
      - key: CLICKPESA_WEBHOOK_SECRET
        sync: false
      - key: CLICKPESA_PAYOUTS_ENABLED
        value: "false"
      - key: CLICKPESA_CURRENCY
        value: TZS
      - key: CLICKPESA_TIMEOUT
        value: "45"
      - key: TIME_ZONE
        value: Africa/Dar_es_Salaam
